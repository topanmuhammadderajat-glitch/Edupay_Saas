services:
  - type: web
    name: edupay-saas-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm run prisma:deploy:supabase
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: GOOGLE_CLOUD_PROJECT
        value: edupay-saas
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SUPERADMIN_MASTER_KEY
        sync: false
      - key: SUPERADMIN_SESSION_SECRET
        generateValue: true
      - key: PUBLIC_FRONTEND_URL
        value: https://edupay-saas.web.app
      - key: ONBOARDING_FRONTEND_URL
        value: https://edupay-saas.web.app
      - key: CORS_ORIGINS
        value: https://edupay-saas.web.app,https://edupay-saas.firebaseapp.com
# PUBLIC_API_URL uses Render's automatic RENDER_EXTERNAL_URL when omitted.
# PORT is assigned by Render. Supabase remains the database; no Render database is provisioned.

# Liveness ping: GET /api/health. Readiness still checks database and Firebase.
# Free plan only; do not provision paid services or a Render database.
